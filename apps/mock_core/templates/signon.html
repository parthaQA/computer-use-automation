<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <title>SON01 — MEMSYS Sign-On</title>
  <link rel="stylesheet" href="/static/core.css">
</head>
<body bgcolor="#c9d2c9">
<table width="100%" cellpadding="8" cellspacing="0" border="0" bgcolor="#003366">
  <tr>
    <td><font color="#ffffff" face="Tahoma" size="3"><b>NORTHSTAR CREDIT UNION</b></font><br>
      <font color="#cccccc" face="Tahoma" size="2">MEMSYS 4.2 Core Servicing Console</font></td>
    <td align="right"><span class="screenid">SON01</span></td>
  </tr>
</table>
<br>
<center>
<table width="420" cellpadding="8" cellspacing="0" border="1" bordercolor="#003366" bgcolor="#e8eee8">
  <tr bgcolor="#003366">
    <td><font color="#ffffff" face="Tahoma" size="2"><b>Operator Sign-On</b></font></td>
  </tr>
  <tr>
    <td>
      {% if err == "REJECT" %}
      <p class="err">Sign-on rejected — invalid operator or password.</p>
      {% endif %}
      <form method="post" action="/signon">
        <table cellpadding="4" cellspacing="0" border="0">
          <tr>
            <td>Operator ID:</td>
            <td><input type="text" name="OPR" size="10" maxlength="8"></td>
          </tr>
          <tr>
            <td>Password:</td>
            <td><input type="password" name="PWD" size="12"></td>
          </tr>
          <tr>
            <td></td>
            <td><input type="submit" value="Sign On"></td>
          </tr>
        </table>
      </form>
      <font size="1" color="#555555">Lab operators: JLEE / demo. Not a real institution.</font>
    </td>
  </tr>
</table>
</center>
</body>
</html>
